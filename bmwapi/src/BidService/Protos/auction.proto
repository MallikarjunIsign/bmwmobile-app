syntax = "proto3";

option csharp_namespace = "GrpcAuctionService";
package auction;

service GrpcAuction {
  rpc GetAuction (GetAuctionRequest) returns (GrpcAuctionResponse);
  // Online payments: a bidder with too many unpaid wins (non-payment strikes) can't bid.
  rpc GetBidderStanding (BidderStandingRequest) returns (BidderStandingResponse);
}

message GetAuctionRequest {
  string auctionId = 1;
}

message GrpcAuctionModel {
  string id = 1;
  string auctionEnd = 2;
  string seller = 3;
  int32 reservePrice = 4;
  bool finished = 5;
  int32 startingPrice = 6;
  int32 bidIncrement = 7;
  // Live, Sold, ReserveNotMet or Unsold
  string status = 8;
  // ISO 8601, empty unless status is ReserveNotMet
  string sellerDecisionDeadline = 9;
}

message GrpcAuctionResponse {
  GrpcAuctionModel auction = 1;
}

message BidderStandingRequest {
  string bidder = 1;
}

message BidderStandingResponse {
  // Empty = may bid; otherwise why not (shown to the bidder).
  string blockedReason = 1;
}
