# ShopCarParts PostgreSQL on the Oracle VM (~/shopcarparts-db).
# Same major version as bmwapi/docker-compose.yml. Only reachable from the VM itself (127.0.0.1);
# the PC connects through an SSH tunnel (bmwapi/db-tunnel.sh). Password: ./.env (chmod 600, never commit).
services:
  postgres:
    image: postgres:18
    container_name: shopcarparts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    command: postgres -c shared_buffers=1GB -c effective_cache_size=4GB -c max_connections=200
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  pgdata:
