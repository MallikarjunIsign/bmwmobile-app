# Who sees which listings + the radius (USA), run by e2e/run-search-e2e.sh as the test buyer in Houston.
# Env (from the script): EMAIL, PASSWORD, PARTS_200 / PARTS_25 = the API's part counts at 200 mi / 25 mi around Houston.
# The buyer's saved locations are reset first, so the GPS location gets the default 200 mi.
#   1. log in → the location line shows 200 mi
#   2. the far SHIPPING-ONLY listing (Long Beach, CA ~1,370 mi) is shown with "🚚 Ships to you"
#   3. the far PICKUP-ONLY listing (Round Rock, TX ~150 mi) is shown inside 200 mi
#   4. radius → 25 mi on Home (no screen change): the pickup-only one disappears, the shipping one stays; counts match
#   5. radius back to 200 mi (so the next run starts the same)
appId: com.bidmywork.app
---
- runFlow: subflows/login.yaml

# 1. Default radius after login with GPS: 200 mi.
- extendedWaitUntil:
    visible: ".*Houston.* · 200 mi ▾"
    timeout: 30000
- takeScreenshot: radius-200
- extendedWaitUntil:
    visible: "See All \\(${PARTS_200}\\) →"
    timeout: 20000

# 3. Far pickup-only listing inside 200 mi (nearer, so it comes first in the list).
- scrollUntilVisible:
    element: "Round Rock, TX"
    direction: DOWN
    visibilityPercentage: 50
    timeout: 60000
- scrollUntilVisible:
    element: ".*Pickup · 1\\d\\d mi away"
    direction: DOWN
    visibilityPercentage: 50
    timeout: 60000
# 2. Far shipping-only listing: shown with "Ships to you" (no pickup badge).
- scrollUntilVisible:
    element: ".*Ships to you.* · 1,3\\d\\d mi away"
    direction: DOWN
    visibilityPercentage: 50
    timeout: 60000
- assertVisible: "Long Beach, CA"
- takeScreenshot: radius-200-listings

# 4. Radius 25 mi from the location line on Home.
- scrollUntilVisible:
    element:
      id: "home-location"
    direction: UP
- tapOn:
    id: "home-location"
- extendedWaitUntil:
    visible: "Location and radius"
    timeout: 10000
- tapOn: "25 mi"
- tapOn: "APPLY RADIUS"
- extendedWaitUntil:
    visible: ".*Houston.* · 25 mi ▾"
    timeout: 15000
# The location line is a fixed header: the list below is still scrolled down, "See All" is above.
- scrollUntilVisible:
    element: "See All \\(${PARTS_25}\\) →"
    direction: UP
    speed: 80
    timeout: 60000
# The shipping listing stays …
- scrollUntilVisible:
    element: "Long Beach, CA"
    direction: DOWN
    visibilityPercentage: 50
    timeout: 60000
- scrollUntilVisible:
    element: ".*Ships to you.* · 1,3\\d\\d mi away"
    direction: DOWN
    visibilityPercentage: 50
    timeout: 60000
# … the far pickup-only one is gone (the whole list is short: scroll to the end and back).
- scrollUntilVisible:
    element: "CREATE A CUSTOM ORDER"
    direction: DOWN
    visibilityPercentage: 50
    timeout: 60000
- assertNotVisible: "Round Rock, TX"
- takeScreenshot: radius-25

# 5. Back to 200 mi.
- scrollUntilVisible:
    element:
      id: "home-location"
    direction: UP
- tapOn:
    id: "home-location"
- extendedWaitUntil:
    visible: "Location and radius"
    timeout: 10000
- tapOn: "200 mi"
- tapOn: "APPLY RADIUS"
- extendedWaitUntil:
    visible: ".*Houston.* · 200 mi ▾"
    timeout: 15000
